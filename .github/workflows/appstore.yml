name: App Store Release

# 申請は毎回の push で走らせず、手で起こす。
# TestFlight に上がっているビルドをそのまま出すので、ここではビルドしない。
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "何をするか"
        type: choice
        default: check
        options:
          - check   # 審査規則に反していないか調べるだけ。何も書き換えない
          - draft   # App Store Connect に下書きを作る。審査には出さない
          - submit  # 下書きを作り、審査に提出する
      auto_release:
        description: "審査通過後に自動で公開する（submit のときだけ効く）"
        type: boolean
        default: false
      build_number:
        description: "出すビルド番号（空ならそのバージョンの最新）"
        type: string
        default: ""

jobs:
  release:
    runs-on: macos-26

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.1'
          bundler: 'latest'
          bundler-cache: true

      - name: Run fastlane
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_CONTENT: ${{ secrets.ASC_KEY_CONTENT }}
          MODE: ${{ inputs.mode }}
          AUTO_RELEASE: ${{ inputs.auto_release }}
          BUILD_NUMBER: ${{ inputs.build_number }}
        run: |
          args=""
          if [ -n "$BUILD_NUMBER" ]; then
            args="build_number:$BUILD_NUMBER"
          fi

          case "$MODE" in
            check)
              bundle exec fastlane release_check
              ;;
            draft)
              bundle exec fastlane release submit:false $args
              ;;
            submit)
              bundle exec fastlane release \
                submit:true auto_release:"$AUTO_RELEASE" $args
              ;;
            *)
              echo "不明な mode: $MODE" >&2
              exit 1
              ;;
          esac
